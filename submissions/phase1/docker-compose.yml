name: llm-race-phase1

services:
  solver:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    environment:
      VLLM_NO_USAGE_STATS: "1"
      HF_HOME: /models/.hf-cache
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - ${MODEL_ID:-/models/PLACEHOLDER_DO_NOT_RUN}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-btc-model}
      - --tensor-parallel-size
      - ${TENSOR_PARALLEL_SIZE:-1}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.90}
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --dtype
      - ${DTYPE:-auto}
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
