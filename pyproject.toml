[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-race-lab"
version = "0.1.0"
description = "Benchmark and lab tooling for Viettel AI Race LLM serving optimization."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
analysis = [
  "pandas>=2.2",
  "pyarrow>=16",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]
monitoring = [
  "prometheus-client>=0.20",
  "nvidia-ml-py>=12.535",
  "psutil>=5.9",
]
clients = [
  "httpx>=0.27",
  "openai>=1.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
llm-race = "llm_race_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
