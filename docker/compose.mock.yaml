name: llm-race-lab

services:
  serving-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    profiles: ["serving"]
    ports:
      - "8000:8000"
    volumes:
      - ../models:/models:ro
    environment:
      HF_HOME: /models/.hf-cache
      VLLM_NO_USAGE_STATS: "1"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - ${MODEL_ID:-/models/PLACEHOLDER_DO_NOT_RUN}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-btc-model}
      - --tensor-parallel-size
      - ${TENSOR_PARALLEL_SIZE:-1}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.90}
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --dtype
      - ${DTYPE:-auto}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]

  benchmark:
    build:
      context: ..
      dockerfile: docker/Dockerfile.benchmark
    image: ${BENCHMARK_IMAGE:-llm-race-benchmark:local}
    profiles: ["benchmark"]
    environment:
      API_BASE: ${API_BASE:-http://serving-vllm:8000/v1}
      API_KEY: ${API_KEY:-}
    volumes:
      - ../workloads:/workspace/workloads
      - ../metrics:/workspace/metrics
      - ../reports:/workspace/reports
    command:
      - doctor
